<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Varipuliyan · Graphic narrative · Live Language Coach</title>
<meta name="description" content="An interactive coastal graphic narrative for English learners: read, listen, tap words and check yourself.">
<meta name="theme-color" content="#0d1530">

<meta property="og:title" content="The Varipuliyan · an interactive coastal graphic narrative"><meta property="og:description" content="Read, listen, tap words and check yourself. Live Language Coach."><meta property="og:image" content="https://www.livelanguagecoach.in/materials/graphic-narrative/cover.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap">
<style>
:root{--ink:#19213a;--muted:#6f7a93;--bg:#f5f6fb;--purple:#6558d3;--lav:#efedff;--teal:#13a99b;--line:#e7e9f1;--sea:#0d1530;--sea2:#16224a;--sand:#fff7e6;--gold:#f2b632}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 16px;font-weight:700}
a{color:inherit}
.hidden{display:none!important}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.3px}
/* ---------- top bar (series) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 4vw;font-size:14px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:800 15px Manrope;white-space:nowrap}
.brand b{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7569e8,#13b6a7);color:#fff;font-size:12px}
.crumb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crumb a{color:var(--purple);text-decoration:none;font-weight:700}
.spacer{flex:1}
/* ---------- hero ---------- */
.hero{position:relative;min-height:330px;color:#fff;display:flex;align-items:flex-end;justify-content:center;text-align:center;overflow:hidden;background:#0d1530}
.hero::before{content:"";position:absolute;inset:0;background:url(hero.webp) center/cover;filter:saturate(.85)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0d153055 0%,#0d1530aa 55%,#0d1530 100%)}
.hero .in{position:relative;z-index:1;padding:60px 20px 36px;max-width:760px}
.genre{color:#8fe9dc;font-weight:700;font-size:14px;letter-spacing:.5px}
.hero h1{font-size:clamp(38px,7vw,64px);line-height:1.02;margin:6px 0 10px;text-shadow:0 3px 18px #0008}
.hero .kick{font:700 13px 'DM Sans';letter-spacing:2px;text-transform:uppercase;color:#c9c4ff}
.credit{font-size:14px;color:#dfe3f3}
/* ---------- series layout ---------- */
.wrap{max-width:1120px;margin:-26px auto 60px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 340px;grid-template-areas:"list a" "list b" "list ." ;grid-template-rows:auto auto 1fr;gap:18px 22px;padding:0 16px}
.wrap>.list{grid-area:list;align-self:start}.wrap>.sideA{grid-area:a}.wrap>.sideB{grid-area:b}
.box{background:#fff;border:1px solid var(--line);border-radius:18px}
.listhead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px}.tabs button{white-space:nowrap;background:transparent;color:var(--muted);padding:8px 13px}.tabs button.on{background:var(--lav);color:var(--purple)}
.sort{font-size:14px;color:var(--muted)}.sort button{background:none;padding:4px 6px;color:var(--muted);font-weight:500}.sort button.on{color:var(--ink);font-weight:700}
.ep{display:flex;align-items:center;gap:16px;padding:10px 20px 10px 10px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .15s}
.ep:hover{background:#fafbff}.ep:last-child{border-bottom:0}
.ep img{width:92px;height:92px;border-radius:10px;object-fit:cover;flex:none;background:#dde}
.ep .t{flex:1;min-width:0}.ep .t b{display:block;font-size:17px}.ep .t small{color:var(--muted);font-size:13px}
.ep .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--muted);text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#e7f8f2;color:#16816e;margin-right:6px}
.tag.p{background:var(--lav);color:var(--purple)}.tag.g{background:#fff1cf;color:#8a6410}
.done{color:#16816e;font-weight:700}
.side .cta{display:grid;gap:10px;padding:18px}
.btn-dark{background:#151a2c;color:#fff;padding:15px;font-size:16px}.btn-dark:hover{background:#000}
.btn-line{background:#fff;border:1px solid #cfd3e0;color:var(--ink);padding:13px}
.btn-p{background:var(--purple);color:#fff}.btn-soft{background:var(--lav);color:var(--purple)}.btn-teal{background:var(--teal);color:#fff}
.stats{display:flex;gap:18px;padding:0 18px 4px;color:var(--muted);font-size:14px;flex-wrap:wrap}.stats b{color:var(--ink)}
.about{padding:14px 18px 18px;color:#3b4560;line-height:1.65}
.how{padding:16px 18px;border-top:1px solid var(--line)}.how h3{margin:0 0 10px;font-size:15px}
.how li{margin:0 0 8px;font-size:14px;color:#4a5370}.how li b{color:var(--ink)}
.bar{height:8px;background:#eef0f6;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7568e8,#17b2a4)}
/* glossary & bank */
.gtools{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.gtools input{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:inherit}
.chipbtn{background:#f1f2f7;color:#4a5370;padding:8px 13px;font-size:13px}.chipbtn.on{background:var(--ink);color:#fff}
.wrow{display:flex;gap:12px;align-items:flex-start;padding:13px 20px;border-bottom:1px solid var(--line)}
.wrow .t{flex:1}.wrow b{font-size:16px}.wrow i{color:var(--muted);font-size:13px;margin-left:6px}.wrow p{margin:3px 0 0;color:#4a5370;font-size:14px}
.ta{font-size:13px;color:#16816e;margin-left:6px}
.ico{background:#f1f2f7;color:var(--ink);width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:16px;flex:none}
.ico.on{background:#fff1cf;color:#b07d00}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
/* flashcards */
.flash{padding:20px;display:grid;gap:14px;justify-items:center}
.card3d{width:min(420px,100%);height:230px;perspective:900px;cursor:pointer}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;text-align:center;padding:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.f{background:linear-gradient(135deg,#211c58,#5146ad 65%,#138c8b);color:#fff;font:800 30px Manrope}
.face.f small{display:block;font:500 13px 'DM Sans';opacity:.8;margin-top:6px}
.face.b{background:var(--sand);transform:rotateY(180deg);font-size:17px;color:#4a3a10}
/* ---------- reader ---------- */
body.reading{background:var(--sea)}
.rbar{position:fixed;top:0;left:0;right:0;z-index:30;background:#0b1229f0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;transition:transform .25s}
.rbar.hide{transform:translateY(-100%)}
.rbar .row{display:flex;align-items:center;gap:8px;padding:9px 12px;max-width:900px;margin:auto}
.rbar .ttl{flex:1;min-width:0;font-size:14px;line-height:1.25}.rbar .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbar .ttl small{color:#9aa6c8}
.rb{background:#ffffff14;color:#fff;padding:8px 12px;font-size:13px;white-space:nowrap}.rb.on{background:var(--teal)}
.rb.back{font-size:20px;padding:4px 12px}
.prog{height:3px;background:#ffffff1a}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8f84ff,#2fd3c3);transition:width .2s}
.strip{max-width:690px;margin:0 auto;padding:64px 0 120px}
.epintro{color:#dfe5ff;text-align:center;padding:34px 20px 26px}
.epintro .n{font:700 13px 'DM Sans';letter-spacing:2px;color:#8fe9dc;text-transform:uppercase}
.epintro h2{font-size:clamp(28px,5vw,40px);margin:6px 0;color:#fff}
.epintro p{margin:6px auto 0;max-width:520px;color:#aeb8d8;font-size:15px}
.tipbox{margin:16px auto 0;max-width:520px;background:#ffffff10;border:1px solid #ffffff1f;border-radius:14px;padding:12px 14px;font-size:14px;color:#c9d2f0;text-align:left}
.panel{margin:0 0 14px;scroll-margin-top:60px}
.panel .art{background:#000;display:flex;justify-content:center}
.panel img{display:block;max-width:100%;width:auto;height:auto;max-height:90vh;cursor:zoom-in}
.cap{background:#fff;margin:0 10px;border-radius:0 0 16px 16px;padding:12px 14px 13px;display:flex;gap:12px;align-items:flex-start;position:relative;top:-1px}
.cap.speaking{box-shadow:0 0 0 3px var(--teal) inset}
.cap .say{flex:none;width:38px;height:38px;padding:0;display:grid;place-items:center;background:var(--lav);color:var(--purple);font-size:16px}
.cap .say.on{background:var(--teal);color:#fff}
.cap .txt{flex:1;font-size:16px;line-height:1.65;color:#222a44}
.cap .who{font-weight:700;color:var(--purple);font-size:13px;display:block;margin-bottom:1px}
.cap .scene{font-style:italic;color:#59627d}
.cap .scene::before{content:"Scene · ";font-style:normal;font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.cap .reply{display:block;margin-top:5px;padding-left:10px;border-left:3px solid #d9dcf0}
.w{background:none;border:0;padding:0 1px;border-radius:4px;font:inherit;color:#0b7c71;font-weight:700;border-bottom:2px dotted #13a99b;cursor:pointer;line-height:inherit}
.w:hover,.w:focus{background:#e2f7f3;outline:none}.w.saved{color:#9a6b00;border-bottom-color:var(--gold)}
.pics{margin-top:7px;font-size:13px;color:var(--muted)}.pics .w{font-size:14px;margin:0 4px}
.wordsoff .cap{display:none}
.wordsoff .panel{margin-bottom:0}
/* end of episode */
.end{margin:26px 10px 0;display:grid;gap:16px}
.endhead{text-align:center;color:#fff;padding:10px 0}
.endhead h3{margin:4px 0;font-size:26px}.endhead p{color:#aeb8d8;margin:0}
.like{background:#ffffff14;color:#fff;margin-top:12px;padding:10px 18px}.like.on{background:#ff4d6d}
.act{background:#fff;border-radius:18px;padding:20px}
.act h3{margin:0 0 4px;font-size:20px}.act .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.q{border-top:1px solid var(--line);padding:14px 0}.q:first-of-type{border-top:0}
.q p{margin:0 0 9px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#f6f7fb;border:1px solid var(--line);border-radius:12px;margin:7px 0;padding:11px 14px;font-weight:500;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--purple)}
.opt.right{background:#e7f8f2;border-color:#16a085;color:#0d6b5a;font-weight:700}
.opt.wrong{background:#ffe9e4;border-color:#e07a62;color:#a33a24}
.opt[disabled]{cursor:default}
.ex{font-size:14px;background:var(--sand);color:#6b5414;border-radius:10px;padding:9px 12px;margin-top:6px}
.score{display:flex;align-items:center;gap:12px;background:var(--lav);border-radius:14px;padding:14px;margin-top:8px;flex-wrap:wrap}
.score b{font:800 26px Manrope;color:var(--purple)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;line-height:1.6;resize:vertical}
.wc{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:8px 0;flex-wrap:wrap}
.used{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.used span{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef0f6;color:#6f7a93}.used span.y{background:#e7f8f2;color:#16816e;font-weight:700}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.line{background:var(--sand);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:12px;color:#4a3a10}
audio{width:100%;margin-top:10px}
.ord{display:grid;gap:8px}.ord button{text-align:left;border-radius:12px;background:#f6f7fb;border:1px solid var(--line);font-weight:500;color:var(--ink);padding:11px 14px}
.ord button.picked{background:var(--lav);border-color:var(--purple);color:var(--purple)}
.ord button .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;font-size:12px;margin-right:8px}
.nextcard{display:flex;gap:14px;align-items:center;background:linear-gradient(115deg,#211c58,#5146ad 65%,#138c8b);color:#fff;border-radius:18px;padding:14px;text-decoration:none}
.nextcard img{width:76px;height:76px;border-radius:12px;object-fit:cover}.nextcard small{color:#c9c4ff}.nextcard b{display:block;font-size:18px}
.botnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b1229f0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom)}
.botnav.hide{transform:translateY(100%)}
.botnav .row{display:flex;justify-content:space-between;align-items:center;max-width:690px;margin:auto;padding:8px 10px;color:#fff;gap:8px}
.botnav .rb{min-width:44px}
/* word sheet */
.scrim{position:fixed;inset:0;background:#0b1229a0;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:22px 22px 0 0;max-width:560px;margin:auto;padding:12px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px #0004}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#d9dce6;margin:0 auto 12px}
.sheet h3{font-size:30px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pos{font:500 14px 'DM Sans';color:var(--muted);font-style:italic}
.sheet .tamil{color:#16816e;font-weight:700;margin-top:2px}
.sheet .mean{font-size:18px;margin:12px 0 8px;line-height:1.5}
.sheet .exs{background:var(--sand);border-radius:12px;padding:11px 14px;color:#5a4712;font-size:15px}
.sheet .exs b{color:#3d2f05}
.sheet .seen{font-size:13px;color:var(--muted);margin:10px 0 14px}
.badge-c{font:700 11px 'DM Sans';padding:3px 9px;border-radius:20px;background:#e2f7f3;color:#0b7c71;letter-spacing:.3px}
/* zoom */
.zoom{position:fixed;inset:0;z-index:60;background:#000e;display:none;overflow:auto;cursor:zoom-out}
.zoom.on{display:block}.zoom img{display:block;width:min(1400px,180vw);max-width:none;margin:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#202743;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;color:#9aa2b4;font-size:12px;padding:10px 16px 30px}
body.reading footer{display:none}
@media(max-width:900px){.wrap{grid-template-columns:1fr;grid-template-areas:"a" "list" "b";grid-template-rows:auto}}
@media(max-width:560px){
 .hero{min-height:280px}.ep{gap:12px;padding-right:12px}.ep img{width:72px;height:72px}.ep .t b{font-size:15px}
 .ep .meta .num{display:none}.listhead{padding:12px 14px}.wrow,.gtools{padding-left:14px;padding-right:14px}
 .rbar .lbl{display:none}.tabs button{padding:8px 10px;font-size:14px}.cap{margin:0 6px}.end{margin:22px 6px 0}.act{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sw"></div>
<div class="zoom" id="zoom"><img alt=""></div>
<div class="toast" id="toast"></div>
<footer>© 2026 Maria Kaisar Aaron R · Live Language Coach · Neithal Narratives</footer>
<script src="data.js"></script>
<script>
(()=>{
"use strict";
const S=window.SERIES,W=window.WORDS,EPS=window.EPISODES,DIM=window.PANEL_DIMS||{};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
/* ---------- storage (per browser) ---------- */
const KEY="gn_varipuliyan_v1";
const st=(()=>{let d={};try{d=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}return Object.assign({read:{},score:{},bank:[],likes:{},last:null,writing:{},prefs:{words:true,rate:.9}},d)})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)};
/* ---------- where each word appears ---------- */
const SEEN={};EPS.forEach(e=>e.panels.forEach(p=>p.k.forEach(k=>{(SEEN[k]=SEEN[k]||new Set).add(e.id)})));
const totalPanels=EPS.reduce((n,e)=>n+e.panels.length,0);
const img=(e,i)=>`panels/ep${e}-${String(i+1).padStart(2,"0")}.webp`;
/* ---------- speech ---------- */
const synth=window.speechSynthesis;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();voice=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speak(text,onend){if(!synth){toast("Read-aloud is not supported in this browser.");onend&&onend(false);return}
 synth.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,""));if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-IN";
 u.rate=st.prefs.rate||.9;u.onend=()=>onend&&onend(true);u.onerror=()=>onend&&onend(false);synth.speak(u)}
function stopSpeak(){if(synth)synth.cancel();auto=false;$$(".say.on,.cap.speaking").forEach(x=>x.classList.remove("on","speaking"));const b=$("#autoBtn");if(b){b.classList.remove("on");b.innerHTML='▶ <span class="lbl">Auto-read</span>'}}
/* ---------- word highlighting ---------- */
function markup(text,keys){
 const hits=[];
 keys.forEach(k=>{const d=W[k];if(!d)return;const forms=[d.w,...(d.f||[])].sort((a,b)=>b.length-a.length);
  for(const f of forms){const re=new RegExp("(^|[^A-Za-z])("+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+")+")(?![A-Za-z])","i");const m=re.exec(text);
   if(m){const s=m.index+m[1].length,e=s+m[2].length;if(!hits.some(h=>s<h.e&&e>h.s)){hits.push({s,e,k});return}}}
  hits.push({k,miss:true})});
 const inText=hits.filter(h=>!h.miss).sort((a,b)=>a.s-b.s);let out="",i=0;
 inText.forEach(h=>{out+=esc(text.slice(i,h.s))+wbtn(h.k,text.slice(h.s,h.e));i=h.e});out+=esc(text.slice(i));
 return {html:out,pics:hits.filter(h=>h.miss).map(h=>h.k)}}
const wbtn=(k,label)=>`<button class="w${st.bank.includes(k)?" saved":""}" data-w="${k}">${esc(label)}</button>`;
/* ---------- word sheet ---------- */
let sheetKey=null;
function openWord(k){const d=W[k];if(!d)return;sheetKey=k;const saved=st.bank.includes(k);
 const seen=[...(SEEN[k]||[])].map(n=>"Ep. "+n).join(", ");
 const ex=esc(d.ex).replace(new RegExp("("+[d.w,...(d.f||[])].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","i"),"<b>$1</b>");
 $("#sheet").innerHTML=`<div class="grab"></div>
 <h3 id="sw">${esc(d.w)} <span class="pos">${esc(d.pos)}</span>${d.coastal?'<span class="badge-c">COASTAL WORD</span>':""}</h3>
 ${d.ta?`<div class="tamil">${esc(d.ta)}</div>`:""}
 <div class="mean">${esc(d.m)}</div>

$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){closeSheet();$("#zoom").classList.remove("on")}});
document.addEventListener("input",ev=>{if(ev.target.id==="gq"){gq=ev.target.value;const keys=Object.keys(W).filter(k=>{const d=W[k];if(gf==="coastal"&&!d.coastal)return false;if(gf==="saved"&&!st.bank.includes(k))return false;const q=gq.trim().toLowerCase();return !q||d.w.toLowerCase().includes(q)||d.m.toLowerCase().includes(q)}).sort((a,b)=>W[a].w.localeCompare(W[b].w));$("#glist").innerHTML=keys.map(wrow).join("")||'<div class="empty">No words found.</div>'}
 if(ev.target.id==="wtext")updateWriting()});
/* hide bars while scrolling down (webtoon style), show on scroll up */
let ticking=false;window.addEventListener("scroll",()=>{if(ticking||route.v!=="ep")return;ticking=true;requestAnimationFrame(()=>{
 const y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;const p=$("#prog");if(p)p.style.width=Math.min(100,y/h*100)+"%";
 const down=y>lastY+6,up=y<lastY-6;if(down&&y>120){$("#rbar")?.classList.add("hide");$("#botnav")?.classList.add("hide")}if(up||y>h-40){$("#rbar")?.classList.remove("hide");$("#botnav")?.classList.remove("hide")}
 if(Math.abs(y-lastY)>6)lastY=y;ticking=false})},{passive:true});
window.addEventListener("pagehide",stopSpeak);
render();
/* fill writing-task word list once the reader is drawn */
new MutationObserver(()=>{if($("#wtext")&&!$("#wused").childElementCount)updateWriting()}).observe(app,{childList:true});
})();
</script>
</body>
</html>
