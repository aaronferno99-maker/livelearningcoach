<!-- Independent chatbot pop-up -->
<div id="chatbotWidget" class="chatbot-widget">
  <section id="chatbotPanel" class="chatbot-panel" aria-label="Language Coach chatbot" aria-hidden="true">
    <div class="chatbot-heading">
      <div class="chatbot-head-left">
        <div class="chatbot-mascot" aria-hidden="true">
          <svg viewBox="0 0 56 56" width="40" height="40" fill="none">
            <circle class="orbit-slow" cx="28" cy="28" r="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>
            <circle cx="28" cy="26" r="12" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="1.6"/>
            <circle class="vocab-dot-1" cx="24" cy="25" r="1.8" fill="#5EEAD4"/>
            <circle class="vocab-dot-2" cx="32" cy="25" r="1.8" fill="#5EEAD4"/>
            <path class="wave-float" d="M22 30 Q28 34 34 30" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            <path class="wave-float" d="M12 43 Q20 38 28 43 T44 43" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <strong>Neithal Word Coach</strong>
          <span>Alai · Coastal ELT Assistant</span>
        </div>
      </div>
      <button type="button" id="chatbotClose" class="chatbot-close" aria-label="Close chatbot">×</button>
    </div>
    <iframe
      id="chatbotFrame"
      title="Live Language Coach chatbot"
      src="https://script.google.com/macros/s/AKfycbwVhttDLa98uzQrzMfb2DWC6oek-AhzpnjXKGG96tT-TvKBNBBisVfLcehziB8aoQz_Zw/exec?type=popup"
      loading="lazy"
      allow="microphone; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </section>
  <div class="chatbot-toggle-wrap">
    <span class="chatbot-halo" aria-hidden="true"></span>
    <button type="button" id="chatbotToggle" class="chatbot-toggle" aria-expanded="false" aria-controls="chatbotPanel">
      <span class="chatbot-toggle-icon" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="22" height="22" fill="none">
          <circle class="orbit-slow" cx="14" cy="14" r="11" stroke="rgba(255,255,255,0.7)" stroke-width="1.3" stroke-dasharray="3 3"/>
          <path class="wave-float" d="M9 14.5 Q11.5 11.5 14 14.5 T19 14.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>

    </button>
  </div>

<script>
(() => {
  const toggle = document.getElementById('chatbotToggle');
  const panel = document.getElementById('chatbotPanel');
  const close = document.getElementById('chatbotClose');
  if (!toggle || !panel || !close) return;
  const setOpen = (open) => {
    panel.classList.toggle('is-open', open);
    panel.setAttribute('aria-hidden', String(!open));
    toggle.setAttribute('aria-expanded', String(open));
    toggle.querySelector('span:last-child').textContent = open ? 'Close' : 'Ask Coach';
  };
  toggle.addEventListener('click', () => setOpen(!panel.classList.contains('is-open')));
  close.addEventListener('click', () => setOpen(false));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') setOpen(false);
  });
})();
</script>
<script>
/* v5.4 mobile menu: slim sticky header with a menu icon */
(()=>{const h=document.querySelector('header'),b=document.getElementById('navToggle'),n=document.getElementById('nav'),s=document.getElementById('navScrim');if(!h||!b||!n||!s)return;
const set=o=>{h.classList.toggle('nav-open',o);document.body.classList.toggle('nav-open',o);b.setAttribute('aria-expanded',String(o));b.setAttribute('aria-label',o?'Close menu':'Open menu')};
b.addEventListener('click',()=>set(!h.classList.contains('nav-open')));
n.addEventListener('click',e=>{if(e.target.closest('button'))set(false)});
h.querySelector('.account').addEventListener('click',()=>set(false));
s.addEventListener('click',()=>set(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
addEventListener('resize',()=>{if(innerWidth>800)set(false)});
let y=scrollY;addEventListener('scroll',()=>{if(Math.abs(scrollY-y)>40)set(false);y=scrollY},{passive:true});
})();
</script>
